分＋步行／纜車","transport":"市電「十字街」「末廣町」「谷地頭」","history":"1859 年函館開港後，外國領事館、教會與西式文化在元町一帶發展。函館山腳下共有 19 條朝港口延伸的坡道，形成函館最具代表性的異國港町景觀。","intro":"適合排半天到晚上：先逛元町教會群與歷史建築，再到函館山看夜景；也可以向南延伸到函館公園、谷地頭與函館八幡宮。","winter":"坡道和石階結冰機率高；冬季函館山登山道路關閉，主要使用纜車。","source":"https://www.hakodate.travel/en/sightseeing-spots/view/slopes-in-motomachi/","children":[["八幡坂","八幡坂","景點","街景・拍照","從坡頂直望函館港，是元町最經典的拍照構圖之一。","assets/img/hakodate-motomachi-v1.webp"],["函館區公會堂","旧函館区公会堂","景點","歷史建築","代表性的西洋館，可參觀室內與陽台；11–3 月通常 17:00 前閉館。","assets/img/hakodate-motomachi-v3.webp"],["舊英國領事館","旧イギリス領事館","景點","歷史建築","保存開港後領事館文化，可看歷史展覽與英式庭園。","assets/img/variants/hakodate-motomachi-v3-alt02.webp"],["函館哈利斯特斯正教會","函館ハリストス正教会","景點","教會・建築","元町教會群地標，白牆綠頂與鐘聲很有辨識度。","assets/img/variants/hakodate-motomachi-v1-alt02.webp"],["函館山展望台","函館山展望台","景點","展望・夜景","函館百萬夜景核心；從十字街步行至纜車山麓站後，纜車約 3 分上山。","assets/img/hakodate-motomachi-v2.webp"],["函館公園","函館公園","景點","公園・歷史","日本早期公園之一，園內有博物館、遊樂設施與函館山山腳景觀。","assets/img/variants/hakodate-motomachi-v2-alt02.webp"],["函館市北方民族資料館","函館市北方民族資料館","景點","博物館","介紹愛努與北方民族文化、衣服、工具與工藝。","assets/img/variants/hakodate-motomachi-v1-alt03.webp"]]},{"id":"goryokaku","cn":"五稜郭・本町","jp":"五稜郭・本町","travel":"市電約 17 分＋步行約 13 分","transport":"市電「五稜郭公園前」","history":"五稜郭是幕末時期採西式星形要塞設計建造的城郭，也是箱館戰爭的重要舞台。現在為國家特別史跡，復原的箱館奉行所位於星形城郭中央。","intro":"函館市區最值得排半天的大景點。五稜郭塔先從高處理解星形結構，再進公園與箱館奉行所；周邊餐廳、咖啡、甜點與商場很多。","winter":"積雪時星形城郭輪廓更明顯；冬季有「五稜星之夢」燈飾季節活動。","source":"https://www.hakodate.travel/en/sightseeing-spots/view/goryokaku-park/","children":[["五稜郭塔","五稜郭タワー","景點","展望・歷史","107m 高塔可完整俯瞰星形五稜郭、函館山與津輕海峽方向。","assets/img/hakodate-goryokaku-v3.webp"],["五稜郭公園","五稜郭公園","景點","史跡・公園","國家特別史跡；冬季雪景能清楚看到壕溝、土壘與星形輪廓。","assets/img/variants/hakodate-goryokaku-v3-alt02.webp"],["箱館奉行所","箱館奉行所","景點","復原建築・歷史","在原址依研究復原幕末奉行所，適合理解開港與箱館戰爭背景。","assets/img/hakodate-goryokaku-v2.webp"],["五稜郭塔商店","五稜郭タワー 売店","商店","伴手禮・歷史周邊","土方歲三、五稜郭、函館限定商品集中。","assets/img/variants/souvenir-005.webp"],["六花亭 五稜郭店","六花亭 五稜郭店","商店","甜點・伴手禮","靠近五稜郭，店內有喫茶空間與六花亭商品。","assets/img/variants/des function ratingValue(x){return x.score??x.rating??0}

function __yenNums(s){return [...String(s||'').matchAll(/¥\s*([\d,]+)/g)].map(m=>Number(m[1].replaceAll(',',''))).filter(Number.isFinite)}
function __money(n){return '¥'+Math.round(n).toLocaleString()}
function __twoPerson(price){
 const raw=String(price||''),a=__yenNums(raw);
 if(!a.length)return '兩人預算依店家菜單';
 if(a.length>=2)return `約 ${__money(a[0]*2)}–${__money(a[1]*2)}／2人`;
 if(/[～~]/.test(raw))return `約 ${__money(a[0]*2)} 以下／2人`;
 if(/起|以上/.test(raw))return `約 ${__money(a[0]*2)} 起／2人`;
 return `約 ${__money(a[0]*2)} 左右／2人`;
}
function __firstName(s){return String(s||'招牌料理／季節限定').split(/[／/]/)[0].trim()||'招牌料理／季節限定'}
function __priceLabel(s){return String(s||'依店家最新菜單')}

const __AREA_WALK={"函館站・朝市":"函館站步行約 3–10 分鐘","函館站・大門":"函館站步行約 5–10 分鐘","灣區・十字街":"函館站步行約 15–20 分鐘","元町・函館山":"十字街／元町步行約 5–15 分鐘","五稜郭":"五稜郭公園前站步行約 5–15 分鐘","湯之川":"湯之川溫泉站步行約 3–12 分鐘","大沼":"大沼公園站步行約 3–15 分鐘"};

function __savedTravelPos(){
  try{
    const p=JSON.parse(localStorage.getItem('travelCurrentPosition')||'null');
    if(p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng)))return {lat:Number(p.lat),lng:Number(p.lng)};
  }catch(e){}
  return null;
}
function __walkMinutes(a,b,c,d){
  const R=6371000,p=Math.PI/180,da=(c-a)*p,dl=(d-b)*p;
  const h=Math.sin(da/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dl/2)**2;
  return Math.max(2,Math.round((2*R*Math.asin(Math.sqrt(h)))/75));
}
function __manualWalkTo(lat,lng){
  const p=__savedTravelPos();
  return p?__walkMinutes(p.lat,p.lng,lat,lng):null;
}

const __REGION_CENTER={"函館站・朝市":[41.7737,140.7263],"函館站・大門":[41.7737,140.7263],"灣區・十字街":[41.766,140.715],"元町・函館山":[41.765,140.708],"五稜郭":[41.7967,140.7568],"湯之川":[41.78,140.789],"大沼":[41.981,140.669]};
function __walkText(x){
 const c=__REGION_CENTER[x.area];
 if(c){const mm=__manualWalkTo(c[0],c[1]);if(mm!=null)return `約 ${mm} 分鐘（目前定位）`;}
 return __AREA_WALK[x.area]||x.access||`${x.area||'此區域'}內約 5–15 分鐘`;
}
