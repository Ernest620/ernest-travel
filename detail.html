<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>詳細資料｜Ernest Travel</title><link rel="stylesheet" href="assets/seasonal.css"><link rel="stylesheet" href="assets/weather.css"><style>
.detail-page{max-width:900px;margin:12px auto 48px;padding:0 10px}.detail-back{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#3E3A39;font-weight:900;font-size:12px;margin:4px 0 9px}.detail-card{border:3px solid #3E3A39;border-radius:24px;background:var(--season-surface,#fff);box-shadow:5px 5px 0 var(--season-shadow,#D8D0C8);overflow:hidden}.detail-head{padding:15px 16px;background:var(--season-soft,#FFF0EC);border-bottom:2px solid #3E3A39}.detail-topline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}.detail-badge{display:inline-flex;border:2px solid #3E3A39;border-radius:999px;padding:3px 7px;font-size:9px;font-weight:950;background:var(--season-secondary,#F6D27A)}.detail-grade{background:var(--season-primary,#F2A497)}.detail-head h1{font-size:27px;line-height:1.12;margin:0;color:#3E3A39}.detail-jp{font-size:11px;color:#756e69;margin-top:4px}.detail-summary{font-size:13px;line-height:1.7;margin-top:10px}.detail-body{padding:12px 14px}.detail-section{padding:10px 0;border-bottom:1.5px dashed #c8beb6}.detail-section:last-child{border-bottom:0}.detail-section h2{font-size:12px;margin:0 0 5px;color:#6b625d}.detail-section p{font-size:13px;line-height:1.75;margin:0;white-space:pre-wrap}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;padding:12px 14px 15px}.detail-actions a{display:inline-flex;align-items:center;justify-content:center;border:2px solid #3E3A39;border-radius:10px;padding:8px 11px;text-decoration:none;color:#3E3A39;font-weight:900;font-size:11px;background:#fff}.detail-actions .map{background:var(--season-accent,#A8D3E6)}.detail-actions .source{background:var(--season-green,#B9DAA5)}.detail-missing{border:2px dashed #3E3A39;border-radius:16px;padding:18px;background:#fff}
@media(max-width:700px){.detail-page{padding:0 6px;margin-top:7px}.detail-card{border-radius:18px}.detail-head{padding:11px 12px}.detail-head h1{font-size:22px}.detail-summary{font-size:11.5px;line-height:1.55}.detail-body{padding:8px 11px}.detail-section{padding:8px 0}.detail-section h2{font-size:10px}.detail-section p{font-size:11.5px;line-height:1.6}.detail-actions{padding:9px 11px 12px}.detail-actions a{font-size:10px;padding:7px 9px}}
</style></head><body><main class="detail-page"><a class="detail-back" id="back" href="index.html">← 返回列表</a><section id="detail"></section></main><script src="assets/seasonal.js"></script><script src="assets/weather.js"></script><script src="data/catalog.js"></script><script>
const p=new URLSearchParams(location.search),src=p.get('src')||'',key=p.get('key')||'',all=(window.ERNEST_CATALOG||{})[src]||[],x=all.find(v=>String(v.key)===key),box=document.getElementById('detail');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={tanukikoji:'狸小路',sapporo_underground:'札幌地下街',hakodate_1h:'函館',lake_toya:'洞爺湖',sapporo_2h:'札幌',otaru_5km:'小樽',travel_overview:'北海道總覽',social_hokkaido:'社群情報',must_hokkaido:'大家都推',centrair_4h:'中部國際機場'};document.getElementById('back').href=(src||'index')+'.html';document.getElementById('back').textContent='← 返回'+(labels[src]||'列表');
if(!x){box.innerHTML='<div class="detail-missing"><b>找不到這筆詳細資料。</b><p>請返回上一頁重新選擇。</p></div>'}else{document.title=x.name+'｜Ernest Travel';const meta=[];if(x.rating)meta.push(x.rating);if(x.price)meta.push(x.price);if(x.area)meta.push(x.area);const sections=(x.detail||[]).filter(v=>v&&v[1]);box.innerHTML=`<article class="detail-card"><header class="detail-head"><div class="detail-topline"><span class="detail-badge detail-grade">🔥 ${esc(x.grade)}級</span><span class="detail-badge">${esc(x.category)}</span>${x.area?`<span class="detail-badge">${esc(x.area)}</span>`:''}</div><h1>${esc(x.name)}</h1>${x.jp?`<div class="detail-jp">${esc(x.jp)}</div>`:''}<div class="detail-summary">${esc(x.summary||'')}</div>${meta.length?`<div class="detail-jp">${meta.map(esc).join('・')}</div>`:''}</header><div class="detail-body">${sections.map(s=>`<section class="detail-section"><h2>${esc(s[0])}</h2><p>${esc(s[1])}</p></section>`).join('')}</div><div class="detail-actions">${x.mapQuery?`<a class="map" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.mapQuery+' 北海道')}">📍 Google Maps</a>`:''}${x.sourceUrl?`<a class="source" href="${esc(x.sourceUrl)}">來源／官方資訊</a>`:''}</div></article>`}
</script></body></html>
