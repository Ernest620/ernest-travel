function __yenNums(s){return [...String(s||'').matchAll(/¥\s*([\d,]+)/g)].map(m=>Number(m[1].replaceAll(',',''))).filter(Number.isFinite)}
function __money(n){return '¥'+Math.round(n).toLocaleString()}
function __twoPerson(price){
 const raw=String(price||''),a=__yenNums(raw);
 if(!a.length)return '兩人預算依店家菜單';
 if(a.length>=2)return `約 ${__money(a[0]*2)}–${__money(a[1]*2)}／2人`;
 if(/[～~]/.test(raw))return `約 ${__money(a[0]*2)} 以下／2人`;
 if(/起|以上/.test(raw))return `約 ${__money(a[0]*2)} 起／2人`;
 return `約 ${__money(a[0]*2)} 左右／2人`;
}
function __firstName(s){return String(s||'招牌料理／季節限定').split(/[／/]/)[0].trim()||'招牌料理／季節限定'}
function __priceLabel(s){return String(s||'依店家最新菜單')}

const __AREA_WALK={"洞爺湖溫泉":"溫泉街中心步行約 3–12 分鐘","洞爺站":"JR 洞爺站步行約 3–10 分鐘","花和・高台":"較適合巴士／計程車","洞爺湖北岸":"較適合巴士／自駕","壯瞥・昭和新山":"較適合巴士／計程車","月浦":"較適合巴士／自駕"};

function __savedTravelPos(){
  try{
    const p=JSON.parse(localStorage.getItem('travelCurrentPosition')||'null');
    if(p&&Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng)))return {lat:Number(p.lat),lng:Number(p.lng)};
  }catch(e){}
  return null;
}
function __walkMinutes(a,b,c,d){
  const R=6371000,p=Math.PI/180,da=(c-a)*p,dl=(d-b)*p;
  const h=Math.sin(da/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dl/2)**2;
  return Math.max(2,Math.round((2*R*Math.asin(Math.sqrt(h)))/75));
}
function __manualWalkTo(lat,lng){
  const p=__savedTravelPos();
  return p?__walkMinutes(p.lat,p.lng,lat,lng):null;
}

function __walkText(x){
 const c=__REGION_CENTER[x.area];
 if(c){const mm=__manualWalkTo(c[0],c[1]);if(mm!=null)return `約 ${mm} 分鐘（目前定位）`;}

}
