<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北海道購買清單｜Ernest Travel</title><link rel="stylesheet" href="assets/seasonal.css"><style>
body{margin:0;background:var(--season-paper);color:var(--season-ink);font-family:'Huninn','Noto Sans TC',sans-serif}main{max-width:1100px;margin:auto;padding:14px 13px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a,.btn{border:2px solid var(--season-ink);border-radius:13px;padding:10px 13px;background:var(--season-secondary);color:var(--season-ink);text-decoration:none;font-weight:800;cursor:pointer;font-size:15px}.hero,.panel{border:3px solid var(--season-ink);border-radius:24px;padding:16px;margin-top:14px;background:var(--season-surface);box-shadow:4px 4px 0 var(--season-shadow)}.hero{background:var(--season-soft)}h1{font-size:clamp(27px,5vw,40px);margin:6px 0}h2{font-size:23px;margin:0 0 10px}.small{font-size:14px;color:#685e5a}input,select{font:inherit;padding:11px;border:2px solid var(--season-ink);border-radius:12px;background:white;min-width:0}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.tools input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px}.item{border:2px solid var(--season-ink);border-radius:18px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:7px}.item.checked{background:#e5efdf}.cat{font-size:12px;font-weight:900;background:var(--season-accent);border-radius:99px;padding:3px 9px;align-self:flex-start}.item h3{margin:0;font-size:19px;line-height:1.4}.jp{font-size:13px;color:#665c5b}.item p{margin:0;font-size:15px;line-height:1.55}.item label{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:auto;padding-top:12px}.item label input{width:22px;height:22px;accent-color:#428052}.item a{font-size:14px;color:#205989}.progress{font-weight:900}.warn{border-left:5px solid #df9f49;padding:12px;background:#fff7e4;border-radius:9px}.actions{display:flex;flex-wrap:wrap;gap:10px}@media(max-width:590px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.hero,.panel{padding:13px}.item{font-size:17px}}
</style></head><body><main><div class="top"><a href="index.html">⌂ 回首頁</a><span>北海道 2027・購物備忘</span></div><div class="hero"><h1>🛍️ 日本購買清單</h1><p>藥妝、保健食品、眼藥水、伴手禮與個人待買項目。選取商品即可加入清單，並在手機上勾選已購買。</p><div class="progress" id="count"></div><p class="small">資料儲存於本機瀏覽器；更換手機、清除網站資料或使用無痕模式可能遺失。建議定期匯出備份。</p></div><div class="panel"><h2>我的購買清單</h2><div class="actions"><button class="btn" id="export">匯出清單 JSON</button><label class="btn" for="import">匯入清單 JSON</label><input id="import" type="file" accept="application/json" hidden><button class="btn" id="copy">複製文字清單</button></div><div id="chosen" class="grid" style="margin-top:14px"></div></div><div class="panel"><h2>商品資料庫</h2><div class="warn">目前先恢復可使用的購買清單功能與常見商品分類；DHC、FANCL 全品項及每款商品官方照片尚未完成驗證，請勿將本頁視為完整官方目錄。食品補充品、眼藥水的實際用途及適用性以官方標示、藥師建議為準。</div><div class="tools"><input id="search" placeholder="搜尋 DHC、FANCL、眼藥水、功用…"><select id="filter"><option value="">全部分類</option><option>保健食品</option><option>眼藥水</option><option>伴手禮</option><option>藥妝用品</option><option>自訂</option></select></div><div id="catalog" class="grid"></div></div><div class="panel"><h2>＋ 新增自己想買的商品</h2><div class="tools"><input id="newname" placeholder="商品名稱"><select id="newcat"><option>保健食品</option><option>眼藥水</option><option>伴手禮</option><option>藥妝用品</option><option>自訂</option></select><button class="btn" id="add">加入資料庫</button></div></div></main><script>
const defaults=[['DHC 維他命 C','DHC ビタミンC','保健食品','維生素 C 補充；依標示食用','https://www.dhc.co.jp/'],['DHC 綜合維他命','DHC マルチビタミン','保健食品','多種維生素營養補充','https://www.dhc.co.jp/'],['DHC 維他命 B 群','DHC ビタミンBミックス','保健食品','維生素 B 群補充','https://www.dhc.co.jp/'],['DHC 藍莓萃取','DHC ブルーベリーエキス','保健食品','含藍莓來源成分；不等同眼科藥品','https://www.dhc.co.jp/'],['DHC 鋅','DHC 亜鉛','保健食品','鋅營養素補充','https://www.dhc.co.jp/'],['FANCL 綜合維他命','FANCL マルチビタミン','保健食品','多種維生素補充；實際品名與配方請以官網為準','https://www.fancl.co.jp/'],['FANCL 膠原蛋白','FANCL コラーゲン','保健食品','膠原蛋白補充品；依官方配方標示','https://www.fancl.co.jp/'],['FANCL 葉黃素相關產品','FANCL ルテイン','保健食品','葉黃素類營養補充；不等同眼藥水','https://www.fancl.co.jp/'],['日本人工淚液類眼藥水','人工涙液','眼藥水','保濕潤滑類；依產品用途與藥師指示','https://www.rohto.co.jp/'],['日本抗疲勞類眼藥水','目薬','眼藥水','不同配方與禁忌差異很大，須看產品標示','https://www.santen.com/ja/'],['北海道限定伴手禮','北海道限定お土産','伴手禮','自行確認品牌及保存期限','https://www.sapporo.travel/']];
const K='ernest-shopping-v2';let state;try{state=JSON.parse(localStorage.getItem(K))||{selected:{},done:{},custom:[]}}catch(e){state={selected:{},done:{},custom:[]}};state.selected||={};state.done||={};state.custom||=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const all=()=>defaults.concat(state.custom);const id=x=>x[0]+'|'+x[2];const save=()=>{localStorage.setItem(K,JSON.stringify(state));render()};
function item(x,sel){const key=id(x),on=!!state.selected[key],done=!!state.done[key];return '<article class="item '+(done?'checked':'')+'"><span class="cat">'+esc(x[2])+'</span><h3>'+esc(x[0])+'</h3><span class="jp">'+esc(x[1])+'</span><p>'+esc(x[3])+'</p>'+(x[4]?'<a target="_blank" rel="noopener" href="'+esc(x[4])+'">查看品牌／產品官方網站</a>':'')+'<label><input type="checkbox" data-key="'+esc(key)+'" data-kind="'+(sel?'done':'select')+'" '+(sel?done:on?'checked':'')+'> '+(sel?'已購買':'加入購買清單')+'</label></article>'}
function render(){const chosen=all().filter(x=>state.selected[id(x)]);const done=chosen.filter(x=>state.done[id(x)]).length;document.querySelector('#count').textContent='購買進度：'+done+' / '+chosen.length;document.querySelector('#chosen').innerHTML=chosen.length?chosen.map(x=>item(x,true)).join(''):'<p>尚未選擇商品；請從下方資料庫勾選。</p>';const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;document.querySelector('#catalog').innerHTML=all().filter(x=>(!f||x[2]===f)&&x.join(' ').toLowerCase().includes(q)).map(x=>item(x,false)).join('')||'<p>沒有符合項目，可於下方自行新增。</p>';}
document.addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;const on=e.target.checked;if(e.target.dataset.kind==='select'){if(on)state.selected[k]=true;else{delete state.selected[k];delete state.done[k]}}else state.done[k]=on;save()});
document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;
document.querySelector('#add').onclick=()=>{const n=document.querySelector('#newname').value.trim();if(!n)return alert('請輸入商品名稱');let x=[n,n,document.querySelector('#newcat').value,'自行新增的待買商品',''];if(!all().some(z=>id(z)===id(x)))state.custom.push(x);state.selected[id(x)]=true;document.querySelector('#newname').value='';save()};
document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='北海道購買清單.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.querySelector('#import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());const d=obj.data||obj;if(!d.selected||!d.done||!Array.isArray(d.custom))throw Error('格式不符');state=d;save();alert('匯入成功')}catch(e){alert('匯入失敗：'+e.message)}};
document.querySelector('#copy').onclick=()=>{const t=all().filter(x=>state.selected[id(x)]).map(x=>(state.done[id(x)]?'☑ ':'☐ ')+x[0]).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('已複製')).catch(()=>prompt('複製以下清單',t))};
render();</script></body></html>
