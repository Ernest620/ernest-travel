const K='ernest-shopping-v2';let state;try{state=JSON.parse(localStorage.getItem(K))||{selected:{},done:{},custom:[]}}catch(e){state={selected:{},done:{},custom:[]}};state.selected||={};state.done||={};state.custom||=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const all=()=>defaults.concat(state.custom);const id=x=>x[0]+'|'+x[2];const save=()=>{localStorage.setItem(K,JSON.stringify(state));render()};
function item(x,sel){const key=id(x),on=!!state.selected[key],done=!!state.done[key];return '<article class="item '+(done?'checked':'')+'"><span class="cat">'+esc(x[2])+'</span><h3>'+esc(x[0])+'</h3><span class="jp">'+esc(x[1])+'</span><p>'+esc(x[3])+'</p>'+(x[4]?'<a target="_blank" rel="noopener" href="'+esc(x[4])+'">查看官方目錄／商品圖片</a>':'')+'<label><input type="checkbox" data-key="'+esc(key)+'" data-kind="'+(sel?'done':'select')+'" '+(sel?done:on?'checked':'')+'> '+(sel?'已購買':'加入購買清單')+'</label></article>'}
function render(){const chosen=all().filter(x=>state.selected[id(x)]);const done=chosen.filter(x=>state.done[id(x)]).length;document.querySelector('#count').textContent='購買進度：'+done+' / '+chosen.length;document.querySelector('#chosen').innerHTML=chosen.length?chosen.map(x=>item(x,true)).join(''):'<p>尚未選擇商品；請從下方資料庫勾選。</p>';const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value,br=document.querySelector('#brand').value;document.querySelector('#catalog').innerHTML=all().filter(x=>(!f||x[2]===f)&&(!br||x[5]===br)&&x.join(' ').toLowerCase().includes(q)).map(x=>item(x,false)).join('')||'<p>沒有符合項目，可於下方自行新增。</p>';}
document.addEventListener('change',e=>{const k=e.target.dataset.key;if(!k)return;const on=e.target.checked;if(e.target.dataset.kind==='select'){if(on)state.selected[k]=true;else{delete state.selected[k];delete state.done[k]}}else state.done[k]=on;save()});
document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;document.querySelector('#brand').onchange=render;
document.querySelector('#add').onclick=()=>{const n=document.querySelector('#newname').value.trim();if(!n)return alert('請輸入商品名稱');let x=[n,n,document.querySelector('#newcat').value,'自行新增的待買商品',''];if(!all().some(z=>id(z)===id(x)))state.custom.push(x);state.selected[id(x)]=true;document.querySelector('#newname').value='';save()};
document.querySelector('#export').onclick=()=>{const b=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='北海道購買清單.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.querySelector('#import').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());const d=obj.data||obj;if(!d.selected||!d.done||!Array.isArray(d.custom))throw Error('格式不符');state=d;save();alert('匯入成功')}catch(e){alert('匯入失敗：'+e.message)}};
document.querySelector('#copy').onclick=()=>{const t=all().filter(x=>state.selected[id(x)]).map(x=>(state.done[id(x)]?'☑ ':'☐ ')+x[0]).join('\n');navigator.clipboard?.writeText(t).then(()=>alert('已複製')).catch(()=>prompt('複製以下清單',t))};
render();</script></body></html>
