name: Update Hokkaido social signals
on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_social.py
      - name: Commit daily feed
        run: |
          git config user.name "ernest-travel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/social_daily.json
          git diff --cached --quiet || git commit -m "chore: update daily Hokkaido social signals"
          git push
