<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北海道每日社群情報</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;margin:0;background:#f6f7f8;color:#333}.w{max-width:820px;margin:auto;padding:12px}.h,.item{background:#fff;border:2px solid #333;border-radius:16px;padding:13px;margin-bottom:9px}.item b{font-size:16px}.meta{font-size:11px;color:#777;margin-top:4px}.empty{padding:24px;text-align:center;color:#777}</style><link rel="stylesheet" href="assets/mobile-refresh.css?v=20261027">\n</head><body><main class="w"><a href="index.html">← 回首頁</a><section class="h"><h1>🔥 北海道每日社群情報</h1><p>每天由 GitHub Actions 更新公開可讀的新訊號。IG／Threads 若遇登入牆或限流，僅列公開可索引內容，不會假裝是完整正文。</p><div id="updated"></div></section><div id="list"></div></main><script>fetch('data/social_daily.json?'+Date.now()).then(r=>r.json()).then(d=>{document.getElementById('updated').textContent=d.updated_at?'最近更新：'+d.updated_at:'尚未產生第一次每日更新';const a=d.items||[];document.getElementById('list').innerHTML=a.length?a.map(x=>'<a class="item" href="'+x.url+'"><b>'+x.title+'</b><div class="meta">'+(x.platform||'')+'・'+(x.query||'')+'</div></a>').join(''):'<div class="empty">目前每日資料庫尚未抓到新訊號；排程執行後會自動出現在這裡。</div>'}).catch(()=>document.getElementById('list').innerHTML='<div class="empty">暫時無法讀取每日社群資料。</div>')</script><script src="assets/mobile-refresh.js?v=20261027"></script>\n</body></html>
